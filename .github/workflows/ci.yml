name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # libfdk-aac: the AAC encoder tests (HomeKit, RTSP, HLS audio) run
      # instead of skipping, as on the camera.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfdk-aac2
      - run: test -z "$(gofmt -l .)" || (echo "gofmt:" && gofmt -l . && exit 1)
      - run: go test -race -count=1 ./...
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Same cgo build as the release (AAC-ELD encoder, internal/aaceld).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build daemon (ARM)
        run: |
          CGO_ENABLED=1 CC="zig cc -target arm-linux-gnueabihf.2.30" \
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o bin/openqiarad ./cmd/openqiarad
          file bin/openqiarad
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
